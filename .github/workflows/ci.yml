name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 启动 Redis 与 MySQL 服务容器，使会话持久化测试在 CI 中真实执行（而非跳过）
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agent_scope_customer_work
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Redis 镜像默认无密码；本项目测试使用密码 123456，这里为其设置 requirepass
      - name: Configure Redis password
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          redis-cli -h 127.0.0.1 -p 6379 CONFIG SET requirepass 123456

      - name: Build and test
        run: mvn -B test
        # 说明：
        # - 会话持久化测试探测 localhost:6379 / localhost:3306，服务在线即真实执行存-取-删
        # - 百炼集成测试默认跳过（未设置 RUN_BAILIAN_IT）

      - name: Package
        run: mvn -B -DskipTests package

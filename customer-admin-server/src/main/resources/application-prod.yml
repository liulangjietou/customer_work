# 生产 profile 配置参考，激活方式 SPRING_PROFILES_ACTIVE=prod
#
# 说明：本模块生产环境不自动建表——由 DBA 参照 mysql/admin-schema.sql 走变更流程手工执行
# （与 customer-work 现有约定一致：生产 auto-create/flyway 均关闭）。ADMIN_MYSQL_* / ADMIN_AES_SECRET_KEY
# 等敏感环境变量务必在部署环境注入真实值，不要沿用 application.yml 里的本地开发默认值。

spring:
  flyway:
    enabled: false
  # 凭据类默认值一律清空：application.yml 里为本地开发留的 root/root 在生产是实打实的风险，
  # 而部署手册漏写一项就会静默沿用它（曾经就漏写了整个 admin 段）。
  # 清空后漏配的后果从"用弱口令连上某个库"变成"起不来"——后者一眼可见、五分钟修好。
  datasource:
    url: ${ADMIN_MYSQL_URL:}
    username: ${ADMIN_MYSQL_USERNAME:}
    password: ${ADMIN_MYSQL_PASSWORD:}

# Actuator：收敛暴露面，避免内部诊断信息对外泄漏
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

# 生产默认关闭 Swagger；确需开启时必须由内网网关或零信任代理限制访问。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# AI 编码命令、诊断、重构与沙箱管理属于高风险开发能力，生产环境禁止开放。
# 即使环境变量试图覆盖这些值，AdminProductionReadinessValidator 也会拒绝启动。
admin:
  a2a:
    # 覆盖 application.yml 的本地开发默认值；生产启用 A2A 时必须由 Secret 注入强令牌。
    token: ${ADMIN_A2A_TOKEN:}
  # 客服端生产库沿用 DBA 手工变更约定；Admin 只消费已审核结构，不持有 DDL 权限。
  # 这条铁律此前要靠三行各写一遍来守——新增第四个跨库能力域时只要再造一份连接属性就会漏掉，
  # 而漏掉的后果是 admin 拿着自己那份连接对生产客服端库跑 DDL。收敛成单一连接后只需一行。
  # 与 Java 默认值（true）刻意不同，属「生产明确要求它是关的」，将来默认值变了也仍守得住。
  customer-work-db:
    schema-migration-enabled: false
  sandbox:
    features:
      command-execution-enabled: false
      diagnosis-enabled: false
      refactor-enabled: false
      management-enabled: false
  # MinIO 凭据同样清空默认值（三处共用 MINIO_* 这一组环境变量）。
  # 不清空的话，漏配会让附件、技能包、VibeCoding 归档一起指向 localhost:9000 且用 minioadmin/minioadmin——
  # 生产机上若恰好有一个默认凭据的 MinIO，含对话正文解析结果的附件会被静默写进去。
  skill:
    storage:
      minio:
        endpoint: ${MINIO_ENDPOINT:}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
  vibecoding:
    workspace:
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}

customer-work:
  attachment:
    storage:
      minio:
        endpoint: ${MINIO_ENDPOINT:}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}

logging:
  level:
    root: INFO
    com.richard.fyoung.customeradmin: INFO

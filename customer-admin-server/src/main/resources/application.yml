server:
  port: 8082   # 与 customer-work-app-server(8080)、customer-channel(8081) 分开
  # 禁止容器在 Controller 之前按自带规则重写 remoteAddr；匿名接口统一由
  # ClientIpResolver 按显式 trusted-proxy-cidrs 解析，避免两套信任链相互绕过。
  forward-headers-strategy: none

spring:
  application:
    name: customer-admin-server
  main:
    # 类路径同时存在 webflux(经 starter 传递) 与 web(MVC)；本模块是 Spring MVC，强制 servlet
    web-application-type: servlet
  servlet:
    multipart:
      # 取 Skill zip/md 上传(5MB) 与对话附件解析(customer-work.attachment.max-file-size-mb 默认 10MB) 的较大者留余量：
      # 附件走视觉 OCR/文档解析，单文件上限 10MB，容器层放到 12MB 兜底（应用层再按白名单/大小精确校验）。
      max-file-size: 12MB
      max-request-size: 12MB
  autoconfigure:
    # 关闭 starter 的 WebFlux 自动装配（WebFilter / 响应式 OpenApi 等），仅复用其 web 无关的 Agent 能力类
    # （与 customer-channel 同一手法：不依赖 starter 的自动装配 Bean，需要的能力在本模块的 Config 类里显式 new）
    exclude:
      - com.richard.fyoung.customerwork.autoconfigure.CustomerWorkAutoConfiguration
      # Sa-Token 的 Redis DAO 插件自带自动装配（无条件生效、无开关）。这里排除掉，改由
      # AdminSaTokenDaoConfig 按 admin.sa-token.redis-persistent 开关显式装配：Redis 故障时
      # 运维可关成内存态先把后台救回来（代价是重启需重登），不必改代码重新发版。
      - cn.dev33.satoken.dao.SaTokenDaoRedisJackson
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ADMIN_MYSQL_URL:jdbc:mysql://localhost:3306/customer_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${ADMIN_MYSQL_USERNAME:root}
    password: ${ADMIN_MYSQL_PASSWORD:root}
    hikari:
      pool-name: customer-admin-pool
      maximum-pool-size: 30
      minimum-idle: 5
  flyway:
    enabled: false   # 生产默认关闭，走 DBA 手工执行 mysql/admin-schema.sql；本地/测试环境见 application-dev.yml
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 必须关：V14 的种子数据含 ${now-14d}（sql_define_param.default_value 的动态日期语法，
    # 由 SqlParamValueResolver 在查询时解释），Flyway 默认会把 ${...} 当自己的占位符，
    # 报 "No value provided for placeholder: ${now}" 直接中断迁移。本项目迁移脚本不使用
    # Flyway 占位符功能，全局关闭即可。
    placeholder-replacement: false
  data:
    redis:
      # Sa-Token 登录态存储用（AdminSaTokenDaoConfig 注入这里自动装配出的 RedisConnectionFactory）。
      # 与下面 admin.redis.* 是同一个 Redis 实例、同一批环境变量——两套配置项是因为一边由
      # Spring Boot 自动装配（Lettuce）、一边是本模块手写的 Jedis/Redisson，改地址只需改环境变量。
      host: ${ADMIN_REDIS_HOST:localhost}
      port: ${ADMIN_REDIS_PORT:6379}
      password: ${ADMIN_REDIS_PASSWORD:}
      timeout: 3000ms


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# Sa-Token 认证配置
sa-token:
  token-name: Authorization      # 请求头 / 参数名
  # 登录态有效期（秒），默认 24 小时。登录态存在 Redis（见 admin.sa-token.redis-persistent），
  # 服务重启不丢，这个 24 小时是"从登录那一刻算起的绝对时长"，与进程生命周期无关。
  timeout: ${ADMIN_SATOKEN_TIMEOUT_SECONDS:86400}
  activity-timeout: -1           # 按最后活跃时间续期：-1 表示不限（依赖 timeout 硬过期）
  is-concurrent: true            # 允许同一账号多端登录
  is-share: true                 # 多端共用一个 token
  token-style: uuid
  is-log: false

# AES 加密密钥：AES-256 需 32 字节明文密钥（不入库不硬编码，本地开发用固定测试值，生产由运维走 Secret 管理下发）
admin:
  billing:
    aggregation:
      enabled: ${ADMIN_BILLING_AGGREGATION_ENABLED:false}
      interval-ms: ${ADMIN_BILLING_AGGREGATION_INTERVAL_MS:21600000}
      backfill-days: ${ADMIN_BILLING_AGGREGATION_BACKFILL_DAYS:3}
    settlement:
      zone-id: ${ADMIN_BILLING_SETTLEMENT_ZONE:Asia/Shanghai}
      max-reconciliation-days: ${ADMIN_BILLING_MAX_RECONCILIATION_DAYS:31}
  agent-replay:
    # 生产默认只允许 MOCK；DRY_RUN 必须在独立部署同时显式开启并标记 isolated。
    dry-run-enabled: ${ADMIN_AGENT_REPLAY_DRY_RUN_ENABLED:false}
    environment: ${ADMIN_AGENT_REPLAY_ENVIRONMENT:production}
  slo:
    automation:
      enabled: ${ADMIN_SLO_AUTOMATION_ENABLED:true}
      scan-interval-ms: ${ADMIN_SLO_SCAN_INTERVAL_MS:30000}
      evaluation-interval-ms: ${ADMIN_SLO_EVALUATION_INTERVAL_MS:60000}
      evaluation-lease-ms: ${ADMIN_SLO_EVALUATION_LEASE_MS:120000}
      evaluation-batch-size: ${ADMIN_SLO_EVALUATION_BATCH_SIZE:50}
      notification-scan-interval-ms: ${ADMIN_SLO_NOTIFICATION_SCAN_INTERVAL_MS:5000}
      notification-lease-ms: ${ADMIN_SLO_NOTIFICATION_LEASE_MS:30000}
      notification-batch-size: ${ADMIN_SLO_NOTIFICATION_BATCH_SIZE:50}
      notification-base-backoff-ms: ${ADMIN_SLO_NOTIFICATION_BASE_BACKOFF_MS:1000}
      notification-max-backoff-ms: ${ADMIN_SLO_NOTIFICATION_MAX_BACKOFF_MS:60000}
  improvement:
    automation:
      enabled: ${ADMIN_IMPROVEMENT_AUTOMATION_ENABLED:true}
      scan-interval-ms: ${ADMIN_IMPROVEMENT_SCAN_INTERVAL_MS:30000}
      lease-ms: ${ADMIN_IMPROVEMENT_LEASE_MS:120000}
      batch-size: ${ADMIN_IMPROVEMENT_BATCH_SIZE:50}
      observation-window-ms: ${ADMIN_IMPROVEMENT_OBSERVATION_WINDOW_MS:86400000}
      min-exposure-calls: ${ADMIN_IMPROVEMENT_MIN_EXPOSURE_CALLS:20}
      max-recurrence-signals: ${ADMIN_IMPROVEMENT_MAX_RECURRENCE_SIGNALS:0}
      max-backoff-ms: ${ADMIN_IMPROVEMENT_MAX_BACKOFF_MS:300000}
  aes-secret-key: ${ADMIN_AES_SECRET_KEY:0123456789abcdef0123456789abcdef}
  tenant:
    # 多租户行级隔离（MyBatis-Plus TenantLineInnerInterceptor 全局改写）。默认开启：
    # 关掉等于跨租户数据完全打通，而本系统的登录用户可能来自不同租户。
    # 单租户部署也不必关——所有数据都在同一个 tenant_id 下，过滤条件恒真，行为与关掉一致。
    enabled: ${ADMIN_TENANT_ENABLED:true}
  # 对外开放部署总开关。打开后：内部运维工具（SQL 客户端/账号本/开发者工具箱）的菜单与接口
  # 一并下架、发码强制图形验证码、审核通过不允许并入平台自用的 default 租户。
  # （邮箱与邮箱验证码不在其中：它们无条件强制，与本开关无关）
  # 默认 false（内网自用）——误判成对外只是工具消失，误判成内网等于把这些工具挂到公网上。
  public-deployment:
    enabled: ${ADMIN_PUBLIC_DEPLOYMENT_ENABLED:false}
  registration:
    # 是否开放自助注册；关闭后只能由管理员预建账号
    self-service-enabled: ${ADMIN_REGISTRATION_SELF_SERVICE:true}
    # 注册必须填邮箱、必须填回收到的邮箱验证码——这是不变式，没有开关（见 RegistrationGuard）。
    # 代价是自助注册开着时 SMTP 必须可用，否则链路在「获取验证码」那一步就走不下去；
    # prod profile 由 AdminProductionReadinessValidator 在启动时直接拒绝这种配置。
    # 图形验证码只用在「发码」那一步，注册那一步不再要——手里的邮箱验证码已经是更强的证据。
    # 下面这项在 public-deployment.enabled=true 时被强制为 true，配 false 也不生效
    captcha-enabled: ${ADMIN_REGISTRATION_CAPTCHA:false}
    # 默认不采信客户端可控的转发头。开启时必须同时配置直接连接方的可信代理 CIDR；
    # 服务端从右向左剥离可信代理链，直连、异常头和伪造的最左段都不会被采信
    trust-forwarded-header: ${ADMIN_REGISTRATION_TRUST_XFF:false}
    trusted-proxy-cidrs: ${ADMIN_REGISTRATION_TRUSTED_PROXY_CIDRS:}
    login-lock:
      # 对外部署强制启用，此处只对内网实例生效
      enabled: ${ADMIN_LOGIN_LOCK_ENABLED:false}
  notification:
    mail:
      # 后台唯一的邮件出口，注册验证码与审核结果通知共用。
      # 自助注册开着时这里必须配：邮箱验证码是注册的硬前提，不配的话用户在「获取验证码」
      # 那一步就会收到"邮件服务未配置，请联系管理员"。
      # 开着但不配 host 会让每次发信都去连一个不存在的 SMTP，故装配处额外校验 host 非空
      # （见 MailNotificationConfig）
      enabled: ${ADMIN_MAIL_ENABLED:false}
      host: ${ADMIN_MAIL_HOST:}
      port: ${ADMIN_MAIL_PORT:587}
      username: ${ADMIN_MAIL_USERNAME:}
      password: ${ADMIN_MAIL_PASSWORD:}
      from: ${ADMIN_MAIL_FROM:}
      login-url: ${ADMIN_MAIL_LOGIN_URL:}
  data-scope:
    # 用户维度行级隔离：角色数据范围为 SELF 时，只看本人创建的个人产出物
    # （项目/会话/对话附件/工作台账号本/定时任务/操作日志等，清单见 DataScopeTables）。
    # 与上面的租户开关相互独立，单租户部署同样可用。
    enabled: ${ADMIN_DATA_SCOPE_ENABLED:true}
  # 登录“记住我”勾选后登录态有效期（秒），默认 7 天；不勾选时沿用 sa-token.timeout（24 小时）全局配置
  remember-me-timeout-seconds: ${ADMIN_REMEMBER_ME_TIMEOUT_SECONDS:604800}
  sa-token:
    # 登录态是否持久化到 Redis（见 AdminSaTokenDaoConfig）。默认 true：token 存 Redis，
    # 服务重启/多实例部署都不掉线。设为 false 回退 Sa-Token 内置的 JVM 内存 DAO——
    # 仅在 Redis 故障需要临时把后台救回来时用，代价是重启即全员掉线、多实例互不认 token。
    redis-persistent: ${ADMIN_SATOKEN_REDIS_PERSISTENT:true}
  open-api:
    # 开放 API（/api/open/**）访问令牌，供 customer-channel 等外部模块通过请求头 X-Open-Api-Token 调用。
    # 无默认值：未配置时所有开放 API 一律 401（见 OpenApiAuthInterceptor），不留“空 token 放行”后门。
    token: ${ADMIN_OPEN_API_TOKEN:}
    # 多租户开启时必须配置 token -> tenantId 映射，旧的全局 token 会被拒绝。
    # 推荐通过外部 Secret YAML 注入 admin.open-api.tenant-tokens，避免把令牌提交进仓库。
    tenant-tokens: {}
  a2a:
    # A2A 导出默认关闭；111111 只用于本地开发免配置启动。生产 profile 会清空该默认值，
    # 启用时还会由 AdminProductionReadinessValidator 强制要求至少 32 字节的专用 Bearer Token。
    enabled: ${ADMIN_A2A_ENABLED:false}
    agent-code: ${ADMIN_A2A_AGENT_CODE:}
    token: ${ADMIN_A2A_TOKEN:111111}
  # 后台登录用户的 AI 用量额度：按 sys_user 登录 ID 计，与客服端的
  # customer-work.subject-quota（按终端用户/IP/API Key 计）是同一套机制的两个部署侧。
  # 等级定义共用客服端库的 cw_subject_quota_level（靠 subject_type=ADMIN_USER 区分），
  # 绑定落 sys_user.level_code；后台在「内容风控 → 用户额度 → 后台用户」维护。
  subject-quota:
    enabled: true
    # 未单独分档的后台账号走这一档（出厂种子：1 小时 / 200 万 token / 200 次）
    default-level: admin-default
    # 等级快照的惰性刷新间隔：admin 刻意不开 @EnableScheduling，客服端那套定时轮询在这边不会跑，
    # 只能在读路径上判断"距上次重载是否超过间隔"
    lazy-refresh-ms: 60000
    # 只覆盖真正调模型的入口（Ant 模式）。刻意比客服端窄：后台用户是内部员工，
    # 防的是"调用失控"而不是"有人刷接口"，把翻列表也算进去只会让人干不了活。
    path-patterns:
      - /api/workspace/*/chat/stream
      # 计划确认会接着往下跑同一条 AI 流程，不算进去等于给每轮对话留了一个免费的续跑入口
      - /api/workspace/*/chat/plan/confirm
      - /api/workspace/*/vibecoding/**
      - /api/aiconfig/agent-task/**
      # 评测一次跑完整个数据集，是单次成本最高的入口
      - /api/eval/run
      # 知识库连通性测试会真发一次 embedding 请求
      - /api/aiconfig/knowledge-base/*/test-connectivity
  agent-memory:
    # 智能体长期记忆权威存储：留空（默认）= 落库 ai_agent_memory 表；
    # 需要存磁盘时在此显式指定根目录，记忆改存 {disk-root}/{agentCode}/MEMORY.md（不再读写库表）
    disk-root: ${ADMIN_AGENT_MEMORY_DISK_ROOT:}
  agent-runtime:
    # 同一 tenant + agent + session 的对话跨 Pod 串行；租约必须覆盖允许的最长 Agent 执行时间。
    session-lock-wait-seconds: ${ADMIN_AGENT_SESSION_LOCK_WAIT_SECONDS:10}
    session-lock-lease-seconds: ${ADMIN_AGENT_SESSION_LOCK_LEASE_SECONDS:1800}
  workbench:
    # 生成的 ScriptCat 登录脚本里内嵌的 admin-server 访问基址：脚本用 GM_xmlhttpRequest 回调此地址取凭证。
    # 必须是运行脚本的浏览器可达的地址（本地默认 8082，生产由运维改成内网可达域名）。
    public-api-base: ${ADMIN_WORKBENCH_API_BASE:http://localhost:8082}
  mysql:
    # MysqlAgentStateStore 4 参构造函数要求显式库名（其 2 参构造函数会硬编码成 "agentscope"，见
    # AdminAgentRuntimeConfig 的坑注释）；必须与上面 spring.datasource.url 里的库名保持一致，
    # 独立配置项而非从 JDBC URL 解析，避免字符串解析的脆弱性。
    database-name: ${ADMIN_MYSQL_DATABASE:customer_admin}
  redis:
    # 历史对话列表读缓存（ChatHistoryCache）用，仅缓存/降压，不是权威数据源——权威数据始终是
    # MysqlAgentStateStore；Redis 不可达时 ChatHistoryCache 内部捕获异常退化为直读 MySQL，
    # 不影响主流程可用性，故本地未起 Redis 时也能正常跑。
    host: ${ADMIN_REDIS_HOST:localhost}
    port: ${ADMIN_REDIS_PORT:6379}
    password: ${ADMIN_REDIS_PASSWORD:}
  ldap:
    # OA 域账号（LDAP/AD）单点登录：与用户名密码登录共存，前端登录页 Tab 切换，
    # 后端 POST /api/auth/sso-login（见 AuthService#ssoLogin / LdapAuthService）。
    # 域控地址/UPN 后缀因环境而异，生产由运维通过环境变量注入，不硬编码。
    enabled: ${ADMIN_LDAP_ENABLED:false}
    # yml 不配值时，AdminLdapProperties 会自动从环境变量 ADMIN_LDAP_URL / ADMIN_LDAP_DOMAIN_SUFFIX 读取
    url: ${ADMIN_LDAP_URL:}
    domain-suffix: ${ADMIN_LDAP_DOMAIN_SUFFIX:}
    connect-timeout-millis: ${ADMIN_LDAP_TIMEOUT_MILLIS:5000}
    # 安全默认值为空：LDAP Bind 只证明目录身份，不等于控制面授权；首次登录后由控制面管理员分配角色。
    # 即使显式配置 super_admin/operator，服务端也会拒绝自动绑定 control_plane=1 的角色。
    default-role-codes: ${ADMIN_LDAP_DEFAULT_ROLE_CODES:}
  model:
    egress:
      # 模型端点默认只允许公网；企业内网自建模型须显式列出 host（逗号分隔）。
      # 白名单只放宽 RFC1918/ULA，环回/链路本地/元数据/未指定/组播地址仍永久拒绝。
      allowed-hosts: ${ADMIN_MODEL_EGRESS_ALLOWED_HOSTS:}
    failover:
      # 智能体模型主备容错熔断参数：主模型连续失败达 failure-threshold 次即熔断 open-duration-seconds 秒，
      # 期间请求直接走备用模型；熔断到期自动半开（重置计数、放行一次主模型尝试）。见 ModelCircuitBreakerRegistry。
      failure-threshold: ${ADMIN_MODEL_FAILOVER_FAILURE_THRESHOLD:3}
      open-duration-seconds: ${ADMIN_MODEL_FAILOVER_OPEN_DURATION_SECONDS:60}
  model-health:
    # 持续探测会产生真实模型调用费用，开发环境默认关闭；生产清单显式开启。
    enabled: ${ADMIN_MODEL_HEALTH_ENABLED:false}
    scan-interval-ms: ${ADMIN_MODEL_HEALTH_SCAN_INTERVAL_MS:60000}
    batch-size: ${ADMIN_MODEL_HEALTH_BATCH_SIZE:20}
    worker-count: ${ADMIN_MODEL_HEALTH_WORKER_COUNT:8}
    queue-capacity: ${ADMIN_MODEL_HEALTH_QUEUE_CAPACITY:32}
    probe-timeout-seconds: ${ADMIN_MODEL_HEALTH_PROBE_TIMEOUT_SECONDS:10}
    failure-threshold: ${ADMIN_MODEL_HEALTH_FAILURE_THRESHOLD:3}
    recovery-threshold: ${ADMIN_MODEL_HEALTH_RECOVERY_THRESHOLD:2}
    probe-interval-seconds: ${ADMIN_MODEL_HEALTH_PROBE_INTERVAL_SECONDS:300}
    cooldown-seconds: ${ADMIN_MODEL_HEALTH_COOLDOWN_SECONDS:60}
    max-override-hours: ${ADMIN_MODEL_HEALTH_MAX_OVERRIDE_HOURS:24}
  mcp:
    security:
      # 远程 MCP 默认只允许公网；企业私网/本机 host 必须显式列入，命中后仍拒链路本地/元数据/未指定/组播。
      allowed-hosts: ${ADMIN_MCP_ALLOWED_HOSTS:}
      # stdio 默认关闭；启用时命令与工作目录必须同时命中真实路径白名单，子进程不继承宿主环境。
      allowed-commands: ${ADMIN_MCP_STDIO_ALLOWED_COMMANDS:}
      allowed-working-directories: ${ADMIN_MCP_STDIO_ALLOWED_WORKING_DIRECTORIES:}
      allowed-environment-keys: ${ADMIN_MCP_STDIO_ALLOWED_ENVIRONMENT_KEYS:}
  scheduler:
    # 定时任务调度模式：internal（默认，admin-server 内置动态调度器按 cron 执行，无需外部 XXL-JOB）
    # ｜xxl-job（周期以 XXL-JOB 控制台为准，内置调度器不注册，cron 字段仅保存展示）。两模式互斥执行避免双跑。
    mode: ${ADMIN_SCHEDULER_MODE:internal}
    # 内置调度器线程池大小（需 > 1，单次执行可能是分钟级同步调用）。
    pool-size: ${ADMIN_SCHEDULER_POOL_SIZE:4}
  scheduled-task:
    # 单次任务执行超时（秒）：Agent 同步调用的硬性超时兜底，手动触发接口 / XXL-JOB JobHandler / 内置调度器共用。
    execute-timeout-seconds: ${ADMIN_SCHEDULED_TASK_TIMEOUT_SECONDS:300}
  xxl-job:
    # 定时任务 XXL-JOB 接入：默认关闭，本地无调度中心也能正常启动；手动触发路径不依赖本配置。
    # appname/port 与 customer-work-starter 的 customer-work.scheduler.xxl-job.*
    # 相互独立（两个进程各自的执行器实例，避免注册成同一个执行器互相抢任务）。
    enabled: ${ADMIN_XXL_JOB_ENABLED:false}
    admin-addresses: ${ADMIN_XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    appname: ${ADMIN_XXL_JOB_APPNAME:customer-admin-executor}
    port: ${ADMIN_XXL_JOB_PORT:9998}
    access-token: ${ADMIN_XXL_JOB_ACCESS_TOKEN:}
  customer-work:
    # 客服工单坐席服务（customer-work-app-server，8080）接入：admin-server 作为人工客服后台，通过 HTTP
    # 代理调 8080 的坐席 API，并给 admin-web 前端签发坐席 WS 接入凭证（客服浏览器凭凭证直连 8080）。
    base-url: ${CW_BASE_URL:http://localhost:8080}
    # 坐席 WebSocket 接入地址（客服浏览器直连）。
    ws-url: ${CW_WS_URL:ws://localhost:8080/ws/agent}
    # 运营接口（评测等）调用 8080 时使用的结构化 API Key（keyId + 原始 secret）。
    api-key-id: ${ADMIN_CUSTOMER_WORK_API_KEY_ID:}
    api-key: ${ADMIN_CUSTOMER_WORK_API_KEY:}
    # 坐席令牌签名密钥：必须与 8080 侧共享同一 env（CW_AGENT_WS_SECRET），否则签发的令牌 8080 校验不过。
    agent-secret: ${CW_AGENT_WS_SECRET:dev-agent-secret-change-me-0001}
    # WS 接入凭证有效期（小时）：签发给前端的长有效期凭证。
    credential-expire-hours: ${CW_CREDENTIAL_EXPIRE_HOURS:12}
    # 调用 8080 的连接/读取超时（毫秒），防止 8080 卡死拖垮 admin-server 线程。
    connect-timeout-ms: ${CW_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CW_READ_TIMEOUT_MS:30000}
  sql-config:
    # SQL 配置管理执行防护：目标多为生产库，超时与最大行数硬性兜底，防止慢 SQL/大结果集拖垮外部库。
    query-timeout-seconds: ${ADMIN_SQL_QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${ADMIN_SQL_MAX_ROWS:2000}
  system-tool:
    http:
      # httpclient 系统工具 SSRF 白名单：为空=默认模式（拒环回/内网、放公网）；
      # 非空=收紧模式（仅放行白名单内 host，支持精确域名与 *.example.com 通配后缀）。
      # 逗号分隔多个 host，如 api.example.com,*.internal.corp
      allowed-hosts: ${ADMIN_SYSTEM_TOOL_HTTP_ALLOWED_HOSTS:}
  rag:
    # 外部 RAG 知识库检索。白名单与上面 system-tool 的<刻意分开>：系统工具的目标地址由大模型决定，
    # 必须默认拒内网；RAG 地址由管理员在后台显式配置且通常就在内网（本机 localhost:20002），
    # 故默认放行内网、仅拦链路本地（169.254/16 等云元数据地址）。生产建议显式配置收紧。
    allowed-hosts: ${ADMIN_RAG_ALLOWED_HOSTS:}
    connect-timeout-seconds: ${ADMIN_RAG_CONNECT_TIMEOUT_SECONDS:5}
    # 单次检索请求的请求级超时；保存门禁的实测就靠它兜死等待时间
    request-timeout-seconds: ${ADMIN_RAG_REQUEST_TIMEOUT_SECONDS:8}
    # 对话链路多库并发检索的整体等待上限，超时按空召回降级，绝不拖死对话
    retrieval-timeout-seconds: ${ADMIN_RAG_RETRIEVAL_TIMEOUT_SECONDS:10}
    test-query: ${ADMIN_RAG_TEST_QUERY:连通性测试}
  sandbox:
    # VibeCoding 代码沙箱：local（仅开发）｜docker（容器隔离）｜disabled（生产未提供隔离运行时时关闭执行）。
    mode: ${ADMIN_SANDBOX_MODE:local}
    execute-timeout-seconds: ${ADMIN_SANDBOX_EXECUTE_TIMEOUT_SECONDS:60}
    permission-mode: ${ADMIN_SANDBOX_PERMISSION_MODE:bypass}
    docker:
      image: ${ADMIN_SANDBOX_DOCKER_IMAGE:maven:3.9-eclipse-temurin-17}
      memory-mb: ${ADMIN_SANDBOX_DOCKER_MEMORY_MB:512}
      cpu-count: ${ADMIN_SANDBOX_DOCKER_CPU_COUNT:1}
      network: ${ADMIN_SANDBOX_DOCKER_NETWORK:none}
    guard:
      # 破坏性命令拦截：命中即改写为安全占位，不抛异常打断主链路。默认开启（不同于 starter 的
      # ToolGuardMiddleware 默认关闭——那里客服业务场景默认信任内部工具，这里 Agent 会执行任意
      # shell 命令，风险面更大，默认开更保守）。
      enabled: ${ADMIN_SANDBOX_GUARD_ENABLED:true}
    hitl:
      confirm-timeout-seconds: ${ADMIN_SANDBOX_HITL_CONFIRM_TIMEOUT_SECONDS:300}
      batch-modify-threshold: ${ADMIN_SANDBOX_HITL_BATCH_MODIFY_THRESHOLD:3}
    features:
      # P1/P2 能力在非生产环境默认开放，可通过环境变量逐项关闭；prod profile 强制关闭，
      # ProductionReadinessValidator 会拒绝任何试图在生产开启这些能力的配置。
      command-execution-enabled: ${ADMIN_SANDBOX_COMMAND_EXECUTION_ENABLED:true}
      diagnosis-enabled: ${ADMIN_SANDBOX_DIAGNOSIS_ENABLED:true}
      refactor-enabled: ${ADMIN_SANDBOX_REFACTOR_ENABLED:true}
      management-enabled: ${ADMIN_SANDBOX_MANAGEMENT_ENABLED:true}
      idle-timeout-minutes: ${ADMIN_SANDBOX_IDLE_TIMEOUT_MINUTES:30}
  skill:
    # Skill 保存/上传时把 SKILL.md 正文发布到勾选的存储目标（minio/nacos/sftp）；运行时消费仍从数据库读。
    storage:
      minio:
        # MinIO 对象存储目标（默认且始终启用），实际 key = {prefix}{skillCode}/SKILL.md。
        # 取代已下线的本地 workspace 目标：技能包写单机磁盘在多副本下各副本内容不一致。
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${ADMIN_SKILL_BUCKET:customer-admin-skills}
        prefix: ${ADMIN_SKILL_PREFIX:skills/}
        auto-create-bucket: ${ADMIN_SKILL_AUTO_CREATE_BUCKET:true}
      nacos:
        # Nacos 配置中心目标：默认关闭，enabled=true 才注册 Publisher。dataId={data-id-prefix}{skillCode}.md。
        enabled: ${ADMIN_SKILL_STORAGE_NACOS_ENABLED:false}
        server-addr: ${ADMIN_SKILL_STORAGE_NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${ADMIN_SKILL_STORAGE_NACOS_NAMESPACE:}
        group: ${ADMIN_SKILL_STORAGE_NACOS_GROUP:SKILL_GROUP}
        username: ${ADMIN_SKILL_STORAGE_NACOS_USERNAME:}
        password: ${ADMIN_SKILL_STORAGE_NACOS_PASSWORD:}
        data-id-prefix: ${ADMIN_SKILL_STORAGE_NACOS_DATA_ID_PREFIX:skill-}
        timeout-ms: ${ADMIN_SKILL_STORAGE_NACOS_TIMEOUT_MS:3000}
      sftp:
        # SFTP 目录目标：默认关闭，enabled=true 才注册 Publisher。上传 {remote-dir}/{skillCode}/SKILL.md。
        enabled: ${ADMIN_SKILL_STORAGE_SFTP_ENABLED:false}
        host: ${ADMIN_SKILL_STORAGE_SFTP_HOST:}
        port: ${ADMIN_SKILL_STORAGE_SFTP_PORT:22}
        username: ${ADMIN_SKILL_STORAGE_SFTP_USERNAME:}
        # 连接密码走环境变量注入，不入库、不硬编码。
        password: ${ADMIN_SKILL_STORAGE_SFTP_PASSWORD:}
        remote-dir: ${ADMIN_SKILL_STORAGE_SFTP_REMOTE_DIR:}
        timeout-ms: ${ADMIN_SKILL_STORAGE_SFTP_TIMEOUT_MS:10000}
        strict-host-key-checking: ${ADMIN_SKILL_STORAGE_SFTP_STRICT_HOST_KEY_CHECKING:false}
  runtime-publish:
    # 客服机器人运行时配置发布：命中渠道绑定的智能体/模型被改动后，把运行时配置（模型/兜底/提示词/MCP/
    # maxIters）发布到 Nacos，8080 客服机器人监听热生效。默认关闭，不影响任何现有后台功能。
    # 载荷里的 API Key 密文用上面 admin.aes-secret-key 加密后原样携带，8080 侧用同一密钥（CUSTOMER_WORK_CONFIG_AES_KEY）解密。
    scan-interval-ms: ${ADMIN_RUNTIME_PUBLISH_SCAN_INTERVAL_MS:5000}
    lease-ms: ${ADMIN_RUNTIME_PUBLISH_LEASE_MS:60000}
    batch-size: ${ADMIN_RUNTIME_PUBLISH_BATCH_SIZE:20}
    max-attempts: ${ADMIN_RUNTIME_PUBLISH_MAX_ATTEMPTS:8}
    base-backoff-ms: ${ADMIN_RUNTIME_PUBLISH_BASE_BACKOFF_MS:5000}
    minimum-ack-count: ${ADMIN_RUNTIME_PUBLISH_MINIMUM_ACK_COUNT:1}
    signing:
      enabled: ${ADMIN_RUNTIME_PUBLISH_SIGNING_ENABLED:false}
      key-id: ${ADMIN_RUNTIME_PUBLISH_SIGNING_KEY_ID:}
      secret: ${ADMIN_RUNTIME_PUBLISH_SIGNING_SECRET:}
    # 每个 8080 实例独立身份：tenantId|instanceId|token，逗号分隔；不得复用 admin.open-api token。
    # instanceId/token 分别与 CW_RUNTIME_CONFIG_INSTANCE_ID/CW_RUNTIME_CONFIG_ACK_TOKEN 一一对应。
    ack-identities: ${ADMIN_RUNTIME_PUBLISH_ACK_IDENTITIES:}
    nacos:
      enabled: ${ADMIN_RUNTIME_PUBLISH_NACOS_ENABLED:false}
      server-addr: ${ADMIN_RUNTIME_PUBLISH_NACOS_SERVER_ADDR:localhost:8848}
      # namespace 默认对齐 customer-work：须与 app-server(customer-work.nacos.namespace) 及网关发现端一致，
      # 否则网关发现得到 app-server 却发现不到 admin。别依赖部署时记得设 env。
      namespace: ${ADMIN_RUNTIME_PUBLISH_NACOS_NAMESPACE:customer-work}
      group: ${ADMIN_RUNTIME_PUBLISH_NACOS_GROUP:DEFAULT_GROUP}
      # dataId 必须与 8080 的 customer-work.nacos.runtime-config-data-id 一致。
      data-id: ${ADMIN_RUNTIME_PUBLISH_NACOS_DATA_ID:customer-work-runtime-config}
      username: ${ADMIN_RUNTIME_PUBLISH_NACOS_USERNAME:}
      password: ${ADMIN_RUNTIME_PUBLISH_NACOS_PASSWORD:}
      timeout-ms: ${ADMIN_RUNTIME_PUBLISH_NACOS_TIMEOUT_MS:3000}
      # 服务注册独立子开关：enabled=true 时默认(true)即把 admin 本实例（服务名 customer-admin-server）注册进
      # Nacos 供网关 lb:// 路由——「启用 nacos 就自动注册」的默认行为不变；需要「只发布不注册」时置为 false。
      # 注册与发布共用上面 runtime-publish.nacos.* 连接参数。
      register-enabled: ${ADMIN_RUNTIME_PUBLISH_NACOS_REGISTER_ENABLED:true}
      # instance-ip 留空自动探测本机地址；多网卡/容器场景用环境变量指定网关可达 IP。
      instance-ip: ${ADMIN_RUNTIME_PUBLISH_NACOS_INSTANCE_IP:}
  collaboration:
    # 多 Agent 协作编程（P3-1 降级版）：VibeCoding「协作模式」开关（默认关，前端逐次开启）开启后一次需求
    # 走多角色顺序流水。roles 留空则用内置默认 4 角色（需求分析→方案设计→编码实现→自测审查）；
    # 自定义时每个角色 name/type(PLAN|CODING|REVIEW)/prompt 均可配。role-timeout-seconds 为 PLAN/REVIEW
    # 角色单次一次性模型调用超时。
    role-timeout-seconds: ${ADMIN_COLLAB_ROLE_TIMEOUT_SECONDS:60}
  vibecoding:
    workspace:
      # 会话工作区（VibeCoding 产出物）持久化到 MinIO：工作区本身落在系统临时目录、会被 OS 清理，
      # 而产出物是用户在会话里生成的代码、不是可重建的派生物，必须有权威副本。
      # 整棵目录树（含 .git，回滚与变更 diff 依赖它）打成 tar.gz，一个会话一个对象。
      enabled: ${ADMIN_VIBECODING_WORKSPACE_PERSIST:true}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${ADMIN_VIBECODING_BUCKET:customer-admin-vibecoding}
      prefix: ${ADMIN_VIBECODING_PREFIX:workspaces/}
      auto-create-bucket: ${ADMIN_VIBECODING_AUTO_CREATE_BUCKET:true}
      # 归档在内存里构建，超过上限跳过保存并记 error
      max-archive-mb: ${ADMIN_VIBECODING_MAX_ARCHIVE_MB:100}
  knowledge:
    # 代码知识库（P3-2 降级版）：DashScope 真实 Embedding + MySQL 向量 + 应用层余弦相似度。
    # Key 从 ai_model_config 的 dashscope 行借用（AES 解密），缺失即 fast fail。
    embedding-model: ${ADMIN_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v3}
    embedding-base-url: ${ADMIN_KNOWLEDGE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com}
    dimensions: ${ADMIN_KNOWLEDGE_DIMENSIONS:1024}
    batch-size: ${ADMIN_KNOWLEDGE_BATCH_SIZE:10}
    default-top-k: ${ADMIN_KNOWLEDGE_DEFAULT_TOP_K:5}
    max-chunk-chars: ${ADMIN_KNOWLEDGE_MAX_CHUNK_CHARS:1500}
    # 允许被索引的源码根白名单（源码路径必须落在其一之下，防越权读盘）。默认只允许 admin 工作区；
    # 需索引外部仓库源码时追加其绝对路径根，逗号分隔（YAML 列表）。
  observability:
    otel:
      # OpenTelemetry 链路追踪（见 AdminOtelTracingConfig）：默认关闭，本地无 Collector 也能正常启动。
      # 开启后给后台工作区智能体挂框架的 OtelTracingMiddleware，按 agent/model/tool 三段出 span，
      # 经 OTLP gRPC 异步导出（后端不可达只在 OTel 内部丢弃，不阻塞也不影响业务链路）。
      # admin 是 Spring MVC，本期不出 HTTP 入口 span，span 树以 agent 为根。
      enabled: ${ADMIN_OTEL_ENABLED:false}
      endpoint: ${ADMIN_OTEL_ENDPOINT:http://localhost:4317}
      # 链路后台按 service.name 区分服务，与 8080 侧的 customer-work 分开。
      service-name: ${ADMIN_OTEL_SERVICE_NAME:customer-admin}
      # 采样比例 [0,1]：1.0 全采，生产高流量建议下调；父级已采样的链路始终跟随父级，不会截成两截。
      sampler-ratio: ${ADMIN_OTEL_SAMPLER_RATIO:1.0}
  # 客服端库（agent_scope_customer_work）连接：全 admin 唯一一份，12 个跨库门面共用。
  # 绑的就是 app-server 连同一个库用的那套 MYSQL_* 变量——同一个物理库没有理由有两套变量名，
  # 且 admin Deployment 已 envFrom 同一份 ConfigMap，无需为它新增任何部署配置。
  # 此前这五项被 content-guard / dict / agent-call-stats.app 三处各配一份、且一个占位都没写，
  # 于是既不在部署手册也不在 k8s 清单里，按清单部署会让 12 个门面全去连 pod 内的 localhost:3306。
  customer-work-db:
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:agent_scope_customer_work}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    # Admin 只启动 8082 时也要在首次跨库访问前补齐客服端 V1-V21；生产 profile 关闭，仍由 DBA 变更。
    schema-migration-enabled: ${ADMIN_CUSTOMER_WORK_SCHEMA_MIGRATION_ENABLED:true}
  content-guard:
    # 给后台工作区智能体（对话/VibeCoding）挂敏感词过滤；词库与 8080 客服链路共用客服端库那一份。
    agent-filter-enabled: ${ADMIN_CONTENT_GUARD_ENABLED:false}
    # 生效方向：INBOUND（只管用户输入）| OUTBOUND（只管模型输出）| BOTH（默认，两端都过）。
    # 注意 BOTH + MASK 的语义：用户原话在送进模型前就被打码，模型只看得到打码后的文本，
    # 会出现"答非所问"——那不是故障。只想让模型的回答里不出现该词，就设 OUTBOUND。
    direction: ${ADMIN_CONTENT_GUARD_DIRECTION:BOTH}
    # 命中日志：开了才有「命中看板」的数据。默认关是因为它会把用户原文片段落库（属敏感数据），
    # 是否留存需按合规要求显式决定；片段长度由 hit-log-snippet-max-length 控制，置 0 则只记命中词不留原文。
    hit-log-enabled: ${ADMIN_CONTENT_GUARD_HIT_LOG_ENABLED:false}

# 对话附件多格式解析（starter attachment 域配置，admin 经 AdminAttachmentConfig 显式装配复用这份强类型绑定）。
# 顶层 customer-work.* 前缀（区别于上面 admin.customer-work.* 的坐席服务客户端配置），对应 AttachmentProperties。
customer-work:
  attachment:
    # 原始文件存储：MinIO 对象存储（唯一后端，项目内不落盘），admin 独立 bucket。
    # bucket 惰性确保：应用启动不连 MinIO，首次上传才检查/建桶，故 @SpringBootTest 全上下文启动不触网。
    storage:
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${ADMIN_ATTACHMENT_BUCKET:customer-admin-attachments}
        auto-create-bucket: ${ADMIN_ATTACHMENT_AUTO_CREATE_BUCKET:true}
    # 单文件大小上限（MB）：需与容器层 spring.servlet.multipart 留出的余量匹配。
    max-file-size-mb: ${ADMIN_ATTACHMENT_MAX_FILE_SIZE_MB:10}
    # 解析文本最大字符数，超长截断并在文末追加提示（避免一次性喂进超大上下文）。
    max-parsed-chars: ${ADMIN_ATTACHMENT_MAX_PARSED_CHARS:20000}
    # 追加文本类扩展名（内置已覆盖 md/txt/csv/sql/yaml/log/主流源码等约 50 种，小众类型在此追加，无需改代码）。
    # extra-text-extensions: adoc,rst
    ocr:
      # OCR 引擎：model（视觉大模型）| paddleocr（自建 PaddleOCR 开源 serving，免 Key、数据不出内网）。
      engine: ${ADMIN_ATTACHMENT_OCR_ENGINE:paddleocr}
      # 图片走视觉大模型 OCR（engine=model）：默认百炼 qwen-vl-max；api-key 留空则由工厂回落环境变量 DASHSCOPE_API_KEY。
      # 视觉模型惰性构建——缺 key 不影响启动，仅真正上传图片时才可能失败并落 FAILED 记录。
      provider: ${ADMIN_ATTACHMENT_OCR_PROVIDER:dashscope}
      model-name: ${ADMIN_ATTACHMENT_OCR_MODEL:qwen-vl-max}
      api-key: ${ADMIN_ATTACHMENT_OCR_API_KEY:${DASHSCOPE_API_KEY:}}
      base-url: ${ADMIN_ATTACHMENT_OCR_BASE_URL:}
      timeout-seconds: ${ADMIN_ATTACHMENT_OCR_TIMEOUT_SECONDS:60}
      # 自建 PaddleOCR 开源 serving（engine=paddleocr 时生效，compose 见 docker/paddleocr/）
      paddle:
        base-url: ${ADMIN_ATTACHMENT_OCR_PADDLE_BASE_URL:http://localhost:8868}
        ocr-path: ${ADMIN_ATTACHMENT_OCR_PADDLE_PATH:/ocr}
        timeout-seconds: ${ADMIN_ATTACHMENT_OCR_PADDLE_TIMEOUT_SECONDS:30}

# Actuator 端点暴露：与 application-prod.yml 保持一致，本地 IDE 启动也能被 Prometheus 抓
# /actuator/prometheus（抓取端配置见 docker/observability/prometheus/prometheus.yml）。
# 指标注册表由 customer-work-starter 传递进来的 micrometer-registry-prometheus 提供。
# /actuator/** 已在 SaTokenConfig 的拦截器白名单里，抓取无需带登录态。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.richard.fyoung.customeradmin: INFO

server:
  port: 8082   # 与 customer-work-app(8080)、customer-channel(8081) 分开

spring:
  application:
    name: customer-admin-server
  main:
    # 类路径同时存在 webflux(经 starter 传递) 与 web(MVC)；本模块是 Spring MVC，强制 servlet
    web-application-type: servlet
  servlet:
    multipart:
      # 与 SkillService#parseUploadContent 的 5MB 校验对齐（Skill zip/md 上传），留一点余量
      max-file-size: 6MB
      max-request-size: 6MB
  autoconfigure:
    # 关闭 starter 的 WebFlux 自动装配（WebFilter / 响应式 OpenApi 等），仅复用其 web 无关的 Agent 能力类
    # （与 customer-channel 同一手法：不依赖 starter 的自动装配 Bean，需要的能力在本模块的 Config 类里显式 new）
    exclude:
      - com.richard.fyoung.customerwork.autoconfigure.CustomerWorkAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${ADMIN_MYSQL_URL:jdbc:mysql://localhost:3306/customer_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${ADMIN_MYSQL_USERNAME:root}
    password: ${ADMIN_MYSQL_PASSWORD:root}
    hikari:
      pool-name: customer-admin-pool
      maximum-pool-size: 30
      minimum-idle: 5
  flyway:
    enabled: false   # 生产默认关闭，走 DBA 手工执行 mysql/admin-schema.sql；本地/测试环境见 application-dev.yml
    locations: classpath:db/migration
    baseline-on-migrate: true


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# Sa-Token 认证配置
sa-token:
  token-name: Authorization      # 请求头 / 参数名
  timeout: 7200                  # 登录态有效期（秒），2 小时
  activity-timeout: -1           # 按最后活跃时间续期：-1 表示不限（依赖 timeout 硬过期）
  is-concurrent: true            # 允许同一账号多端登录
  is-share: true                 # 多端共用一个 token
  token-style: uuid
  is-log: false

# AES 加密密钥：AES-256 需 32 字节明文密钥（不入库不硬编码，本地开发用固定测试值，生产由运维走 Secret 管理下发）
admin:
  aes-secret-key: ${ADMIN_AES_SECRET_KEY:0123456789abcdef0123456789abcdef}
  # 登录“记住我”勾选后登录态有效期（秒），默认 7 天；不勾选时沿用 sa-token.timeout（2 小时）全局配置
  remember-me-timeout-seconds: ${ADMIN_REMEMBER_ME_TIMEOUT_SECONDS:604800}
  mysql:
    # MysqlAgentStateStore 4 参构造函数要求显式库名（其 2 参构造函数会硬编码成 "agentscope"，见
    # AdminAgentRuntimeConfig 的坑注释）；必须与上面 spring.datasource.url 里的库名保持一致，
    # 独立配置项而非从 JDBC URL 解析，避免字符串解析的脆弱性。
    database-name: ${ADMIN_MYSQL_DATABASE:customer_admin}
  redis:
    # 历史对话列表读缓存（ChatHistoryCache）用，仅缓存/降压，不是权威数据源——权威数据始终是
    # MysqlAgentStateStore；Redis 不可达时 ChatHistoryCache 内部捕获异常退化为直读 MySQL，
    # 不影响主流程可用性，故本地未起 Redis 时也能正常跑。
    host: ${ADMIN_REDIS_HOST:localhost}
    port: ${ADMIN_REDIS_PORT:6379}
    password: ${ADMIN_REDIS_PASSWORD:}
  ldap:
    # OA 域账号（LDAP/AD）单点登录：与用户名密码登录共存，前端登录页 Tab 切换，
    # 后端 POST /api/auth/sso-login（见 AuthService#ssoLogin / LdapAuthService）。
    # 域控地址/UPN 后缀因环境而异，生产由运维通过环境变量注入，不硬编码。
    enabled: ${ADMIN_LDAP_ENABLED:false}
    # yml 不配值时，AdminLdapProperties 会自动从环境变量 ADMIN_LDAP_URL / ADMIN_LDAP_DOMAIN_SUFFIX 读取
    url: ${ADMIN_LDAP_URL:}
    domain-suffix: ${ADMIN_LDAP_DOMAIN_SUFFIX:}
    connect-timeout-millis: ${ADMIN_LDAP_TIMEOUT_MILLIS:5000}
    default-role-codes: ${ADMIN_LDAP_DEFAULT_ROLE_CODES:super_admin}
  model:
    failover:
      # 智能体模型主备容错熔断参数：主模型连续失败达 failure-threshold 次即熔断 open-duration-seconds 秒，
      # 期间请求直接走备用模型；熔断到期自动半开（重置计数、放行一次主模型尝试）。见 ModelCircuitBreakerRegistry。
      failure-threshold: ${ADMIN_MODEL_FAILOVER_FAILURE_THRESHOLD:3}
      open-duration-seconds: ${ADMIN_MODEL_FAILOVER_OPEN_DURATION_SECONDS:60}
  scheduler:
    # 定时任务调度模式：internal（默认，admin-server 内置动态调度器按 cron 执行，无需外部 XXL-JOB）
    # ｜xxl-job（周期以 XXL-JOB 控制台为准，内置调度器不注册，cron 字段仅保存展示）。两模式互斥执行避免双跑。
    mode: ${ADMIN_SCHEDULER_MODE:internal}
    # 内置调度器线程池大小（需 > 1，单次执行可能是分钟级同步调用）。
    pool-size: ${ADMIN_SCHEDULER_POOL_SIZE:4}
  scheduled-task:
    # 单次任务执行超时（秒）：Agent 同步调用的硬性超时兜底，手动触发接口 / XXL-JOB JobHandler / 内置调度器共用。
    execute-timeout-seconds: ${ADMIN_SCHEDULED_TASK_TIMEOUT_SECONDS:300}
  xxl-job:
    # 定时任务 XXL-JOB 接入：默认关闭，本地无调度中心也能正常启动；手动触发路径不依赖本配置。
    # appname/port 与 customer-work-spring-boot-starter 的 customer-work.scheduler.xxl-job.*
    # 相互独立（两个进程各自的执行器实例，避免注册成同一个执行器互相抢任务）。
    enabled: ${ADMIN_XXL_JOB_ENABLED:false}
    admin-addresses: ${ADMIN_XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    appname: ${ADMIN_XXL_JOB_APPNAME:customer-admin-executor}
    port: ${ADMIN_XXL_JOB_PORT:9998}
    access-token: ${ADMIN_XXL_JOB_ACCESS_TOKEN:}
  customer-work:
    # 客服工单坐席服务（customer-work-app，8080）接入：admin-server 作为人工客服后台，通过 HTTP
    # 代理调 8080 的坐席 API，并给 admin-web 前端签发坐席 WS 接入凭证（客服浏览器凭凭证直连 8080）。
    base-url: ${CW_BASE_URL:http://localhost:8080}
    # 坐席 WebSocket 接入地址（客服浏览器直连）。
    ws-url: ${CW_WS_URL:ws://localhost:8080/ws/agent}
    # 坐席令牌签名密钥：必须与 8080 侧共享同一 env（CW_AGENT_WS_SECRET），否则签发的令牌 8080 校验不过。
    agent-secret: ${CW_AGENT_WS_SECRET:dev-agent-secret-change-me-0001}
    # WS 接入凭证有效期（小时）：签发给前端的长有效期凭证。
    credential-expire-hours: ${CW_CREDENTIAL_EXPIRE_HOURS:12}
    # 调用 8080 的连接/读取超时（毫秒），防止 8080 卡死拖垮 admin-server 线程。
    connect-timeout-ms: ${CW_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CW_READ_TIMEOUT_MS:30000}
  sql-config:
    # SQL 配置管理执行防护：目标多为生产库，超时与最大行数硬性兜底，防止慢 SQL/大结果集拖垮外部库。
    query-timeout-seconds: ${ADMIN_SQL_QUERY_TIMEOUT_SECONDS:30}
    max-rows: ${ADMIN_SQL_MAX_ROWS:2000}
  system-tool:
    http:
      # httpclient 系统工具 SSRF 白名单：为空=默认模式（拒环回/内网、放公网）；
      # 非空=收紧模式（仅放行白名单内 host，支持精确域名与 *.example.com 通配后缀）。
      # 逗号分隔多个 host，如 api.example.com,*.internal.corp
      allowed-hosts: ${ADMIN_SYSTEM_TOOL_HTTP_ALLOWED_HOSTS:}
  sandbox:
    # VibeCoding 代码沙箱：local（默认，无隔离，直接跑宿主机）｜docker（容器隔离，需本机/服务器已装 Docker）。
    mode: ${ADMIN_SANDBOX_MODE:local}
    execute-timeout-seconds: ${ADMIN_SANDBOX_EXECUTE_TIMEOUT_SECONDS:60}
    docker:
      image: ${ADMIN_SANDBOX_DOCKER_IMAGE:maven:3.9-eclipse-temurin-17}
      memory-mb: ${ADMIN_SANDBOX_DOCKER_MEMORY_MB:512}
      cpu-count: ${ADMIN_SANDBOX_DOCKER_CPU_COUNT:1}
      network: ${ADMIN_SANDBOX_DOCKER_NETWORK:none}
    guard:
      # 破坏性命令拦截：命中即改写为安全占位，不抛异常打断主链路。默认开启（不同于 starter 的
      # ToolGuardMiddleware 默认关闭——那里客服业务场景默认信任内部工具，这里 Agent 会执行任意
      # shell 命令，风险面更大，默认开更保守）。
      enabled: ${ADMIN_SANDBOX_GUARD_ENABLED:true}
  skill:
    # Skill 保存/上传时把 SKILL.md 正文发布到勾选的存储目标（local/nacos/sftp）；运行时消费仍从数据库读。
    storage:
      local:
        # 本地 workspace 目标（默认且始终启用），实际写入 {base-dir}/{skillCode}/SKILL.md。
        base-dir: ${ADMIN_SKILL_STORAGE_LOCAL_BASE_DIR:./data/admin-workspace/skills}
      nacos:
        # Nacos 配置中心目标：默认关闭，enabled=true 才注册 Publisher。dataId={data-id-prefix}{skillCode}.md。
        enabled: ${ADMIN_SKILL_STORAGE_NACOS_ENABLED:false}
        server-addr: ${ADMIN_SKILL_STORAGE_NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${ADMIN_SKILL_STORAGE_NACOS_NAMESPACE:}
        group: ${ADMIN_SKILL_STORAGE_NACOS_GROUP:SKILL_GROUP}
        username: ${ADMIN_SKILL_STORAGE_NACOS_USERNAME:}
        password: ${ADMIN_SKILL_STORAGE_NACOS_PASSWORD:}
        data-id-prefix: ${ADMIN_SKILL_STORAGE_NACOS_DATA_ID_PREFIX:skill-}
        timeout-ms: ${ADMIN_SKILL_STORAGE_NACOS_TIMEOUT_MS:3000}
      sftp:
        # SFTP 目录目标：默认关闭，enabled=true 才注册 Publisher。上传 {remote-dir}/{skillCode}/SKILL.md。
        enabled: ${ADMIN_SKILL_STORAGE_SFTP_ENABLED:false}
        host: ${ADMIN_SKILL_STORAGE_SFTP_HOST:}
        port: ${ADMIN_SKILL_STORAGE_SFTP_PORT:22}
        username: ${ADMIN_SKILL_STORAGE_SFTP_USERNAME:}
        # 连接密码走环境变量注入，不入库、不硬编码。
        password: ${ADMIN_SKILL_STORAGE_SFTP_PASSWORD:}
        remote-dir: ${ADMIN_SKILL_STORAGE_SFTP_REMOTE_DIR:}
        timeout-ms: ${ADMIN_SKILL_STORAGE_SFTP_TIMEOUT_MS:10000}
        strict-host-key-checking: ${ADMIN_SKILL_STORAGE_SFTP_STRICT_HOST_KEY_CHECKING:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.richard.fyoung.customeradmin: INFO

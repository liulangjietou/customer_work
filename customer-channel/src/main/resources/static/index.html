<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智能客服 · customer-channel</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
           background: #f5f6f8; color: #1f2329; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 14px 20px; background: #2563eb; color: #fff; font-weight: 600; }
    header small { font-weight: 400; opacity: .8; margin-left: 8px; }
    #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 2px; }
    .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 2px; }
    .meta { align-self: center; color: #8a9099; font-size: 12px; }
    footer { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; }
    #text { flex: 1; padding: 11px 14px; border: 1px solid #d0d5dd; border-radius: 10px; font-size: 15px; outline: none; }
    #text:focus { border-color: #2563eb; }
    button { padding: 0 18px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { background: #9bb4ef; cursor: default; }
  </style>
</head>
<body>
  <header>智能客服 <small>customer-channel · Chat Completions Web（OpenAI 兼容 /v1/chat/completions）</small></header>
  <div id="log">
    <div class="meta">已接入 AgentScope 2.0 客服 Agent，请输入您的问题</div>
  </div>
  <footer>
    <input id="text" placeholder="例如：帮我查一下订单 20260613001 的状态" autocomplete="off"/>
    <button id="send">发送</button>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('text');
    const sendBtn = document.getElementById('send');
    const history = [];

    function bubble(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    async function send() {
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      sendBtn.disabled = true;
      bubble('user', content);
      history.push({ role: 'user', content });
      const pending = bubble('bot', '…');
      try {
        const resp = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: 'customer-service', messages: history, stream: false })
        });
        const data = await resp.json();
        const reply = (data.choices && data.choices[0] && data.choices[0].message
          && data.choices[0].message.content) || JSON.stringify(data);
        pending.textContent = reply;
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        pending.textContent = '请求失败：' + e;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    input.focus();
  </script>
</body>
</html>

spring:
  main:
    web-application-type: servlet
  autoconfigure:
    exclude:
      - com.richard.fyoung.customerwork.autoconfigure.CustomerWorkAutoConfiguration
      # starter 引入 MyBatis-Plus 后 spring-jdbc 进入类路径，未配 spring.datasource 时
      # DataSourceAutoConfiguration 会启动失败；本模块不用 Spring 自动数据源，显式关闭
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

agentscope:
  admin:
    enabled: true
    base-path: /admin
    write-token: ""
  chat-completions:
    enabled: true
  agui:
    default-agent-id: customerServiceAgent

customer-work:
  model:
    provider: dashscope
    name: qwen-plus
    api-key: test-dummy-key   # 离线单测用：构造模型不联网，仅验证装配
    stream: false
  session:
    mode: memory
  agent:
    max-iters: 5
  harness:
    permission:
      enabled: true
      mode: default

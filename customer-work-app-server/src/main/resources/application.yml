server:
  port: 8080

spring:
  application:
    name: customer-work-app-server
  # 排除 Spring 的 DataSource 自动配置：业务持久层由 starter 的 CustomerWorkPersistenceConfig
  # 显式装配独立数据源（customerWorkDataSource）。引入 MyBatis-Plus 后 spring-jdbc 进入类路径会激活
  # DataSourceAutoConfiguration，未配 spring.datasource.url 时会启动失败，故在此关闭（本应用不使用 Spring 自动数据源）。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  # 响应式编解码器缓冲上限：控制单次请求聚合到内存的最大字节数（默认 256KB）。
  # 附件上传要把整份文件读进内存交给解析器，故放宽到 12MB（略大于附件 10MB 上限，留边界余量）。
  codec:
    max-in-memory-size: 12MB
  webflux:
    # WebFlux multipart（FilePart）上传限制：默认单分片仅 256KB 内存、超出即落临时盘。
    # 这里把内存与磁盘用量都放宽到 12MB，覆盖附件 10MB 上限；真正的大小/类型防御在
    # AttachmentParseService（customer-work.attachment.max-file-size-mb），此处只放开传输通道。
    multipart:
      max-in-memory-size: 12MB
      max-disk-usage-per-part: 12MB
      max-parts: 16

customer-work:
  model:
    # 百炼 API Key：仅从环境变量注入，切勿写入仓库。本地：export DASHSCOPE_API_KEY=sk-xxx
    api-key: ${DASHSCOPE_API_KEY:}
    # 可切换为 qwen-plus / qwen-turbo 等；模型名对应 DashScope 通义千问系列
    name: qwen-plus
    egress:
      # 热配置中的主/备/路由/实验端点统一受此部署级名单约束；生产启用热更新时必须非空。
      allowed-hosts: ${CUSTOMER_WORK_MODEL_EGRESS_ALLOWED_HOSTS:}
    # GenerateOptions 高级（跨厂商统一）
    top-p:                  # 留空则不设置
    reasoning-effort:       # low | medium | high
    enable-search:          # DashScope 联网搜索（仅 dashscope）
    enable-thinking:        # DashScope 深度思考（仅 dashscope）
    # 按难度分级路由：简单问题走便宜模型。与 fallback 是两件事——那个回答"主模型挂了用谁"，
    # 这个回答"这问题值得用多贵的模型"。判定刻意保守（只有单轮且简短才降级），
    # 判错的代价因此是"没省到钱"而不是"答得差"。框架默认关闭，本示例应用显式开启。
    tiered-routing:
      enabled: true
      # 与主模型同厂商时留空即可，会走同一个 DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY:}
  session:
    # 会话持久化模式：memory（默认，重启丢）| json（单机落盘可恢复）
    #                | redis（分布式共享）| mysql（强一致持久化）
    # 工单系统默认走 mysql：会话状态与工单/消息同库跨实例共享（本机库 agent_scope_customer_work）
    mode: mysql
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mysql:
      host: ${MYSQL_HOST:localhost}
      port: ${MYSQL_PORT:3306}
      database: ${MYSQL_DATABASE:agent_scope_customer_work}
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
  security:
    # 限流：按 API Key 或客户端 IP 维度（默认关闭）
    rate-limit:
      rule-enabled: true
      store-mode: jdbc
  # 主体级速率配额：按调用者限（每登录用户 / 每匿名 IP / 每把 API Key），
  # 滚动窗口内的 token 量与请求次数双上限。与上面按路径限的 rate-limit 正交，两者都判。
  subject-quota:
    enabled: true
    # jdbc：等级读 cw_subject_quota_level（后台「内容风控 → 用户额度」可维护）。
    # 配成 memory 则只认 SubjectQuotaProperties 里的内置档，后台改了不会生效。
    store-mode: jdbc
  nacos:
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:customer-work}
    username: ${NACOS_USERNAME:nacos}
    password: ${NACOS_PASSWORD:nacos}
    # 首次订阅失败会保留旧配置并自动重试，Nacos 恢复后无需重启实例。
    runtime-config-subscribe-retry-ms: ${CW_RUNTIME_CONFIG_SUBSCRIBE_RETRY_MS:10000}
    # 服务注册对外 IP：enabled=true 时把本实例注册进 Nacos 供网关 lb:// 路由，服务名=spring.application.name。
    # 留空自动探测本机地址；多网卡/容器场景用环境变量指定网关可达 IP。
    instance-ip: ${NACOS_INSTANCE_IP:}
    # 运行时配置热更新：接收 admin(8082) 下发的整份运行时配置（模型/兜底/重试/提示词/MCP/maxIters），
    # 无需重启即热替换模型链并重建 Agent。默认关闭；开启后监听 runtime-config-data-id。
    runtime-config-enabled: ${CUSTOMER_WORK_RUNTIME_CONFIG_ENABLED:false}
    # 多租户或租户专属实例必须配置；配置后只消费 <dataId>-tenant-<tenantCode>，不回落主 dataId。
    tenant-code: ${NACOS_TENANT_CODE:}
    # API Key 密文 AES 解密密钥：必须与 admin 的 ADMIN_AES_SECRET_KEY 同值，否则整份配置解密失败并保留旧配置。
    config-aes-key: ${CUSTOMER_WORK_CONFIG_AES_KEY:}
    # 先验签再解密；生产门禁要求开启。轮换旧 key 可通过外部配置绑定 runtime-config-signing-keys map。
    runtime-config-signature-required: ${CW_RUNTIME_CONFIG_SIGNATURE_REQUIRED:false}
    runtime-config-signing-key-id: ${CW_RUNTIME_CONFIG_SIGNING_KEY_ID:}
    runtime-config-signing-secret: ${CW_RUNTIME_CONFIG_SIGNING_SECRET:}
    # 实例应用结果经 DB Outbox 可靠回传 admin；开启运行时配置时生产环必须配置。
    runtime-config-ack-url: ${CW_RUNTIME_CONFIG_ACK_URL:}
    runtime-config-ack-token: ${CW_RUNTIME_CONFIG_ACK_TOKEN:}
    # Pod 下默认使用 HOSTNAME；非容器部署可显式给出稳定实例 ID。
    runtime-config-instance-id: ${CW_RUNTIME_CONFIG_INSTANCE_ID:}
  notification:
    # 主动通知网关：POST JSON {operationId,target,message}，Idempotency-Key 同 operationId。
    webhook-url: ${CW_NOTIFICATION_WEBHOOK_URL:}
    auth-token: ${CW_NOTIFICATION_AUTH_TOKEN:}
    timeout-seconds: ${CW_NOTIFICATION_TIMEOUT_SECONDS:10}
  ticket:
    # 智能客服工单：存储模式 memory（进程内）| jdbc（MyBatis-Plus 实现，跨实例共享，与 session.mysql 同库）
    store-mode: jdbc
  user-auth:
    # 终端用户账户：存储模式 memory | jdbc（MyBatis-Plus 实现，跨实例共享，与 session.mysql 同库）
    store-mode: jdbc
    # 登录态 JWT 签名密钥：生产必须用环境变量 CW_USER_JWT_SECRET 覆盖（默认值仅供本地开发）
    jwt-secret: ${CW_USER_JWT_SECRET:dev-secret-change-me-in-production-0001}
  # ===================== B6 运营闭环 =====================
  # 下面八项的存储默认都是 memory（进程内、重启即丢），而后台是**跨库读客服端库**的——
  # 不切 jdbc，后台的运营闭环页面永远是空的。建表由 SchemaInitializer 统一负责。

  # 评测：跑标准集 → 出报告 → 与上一版对比。意图评测纯离线（不调模型、零 token 成本）
  eval:
    store-mode: jdbc

  # badcase 回流：负反馈 / 质检失败 → 待筛队列 → 转知识库条目或评测用例
  badcase:
    store-mode: jdbc

  # 提示词版本：记「运行时实际生效」的那份（配置中心记的是「发布了什么」，两者会不一致）。
  # 版本号取内容指纹，是效果归因的底座：指标掉了先看这一位变没变
  prompt-version:
    store-mode: jdbc

  # 会话级满意度（CSAT）：与消息级点赞/点踩衡量的是不同的东西
  csat:
    store-mode: jdbc

  # 知识盲区：检索未命中时记一笔，统计「哪些问题反复查不到」，直接告诉运营该补什么
  knowledge-gap:
    store-mode: jdbc

  # 死信队列：工具调用 / 主动通知发送失败后的兜底重投。此前失败只记一行 error，量上来会丢单
  dead-letter:
    store-mode: jdbc

  # 语义缓存：问题向量相似度超阈值就直接复用上次答案，命中即省掉整条模型链。
  #
  # **开启前必读**：在客服场景无差别缓存会造成数据泄露——两个用户都问"我的订单到哪了"，
  # 语义高度相似但正确答案完全不同。三道闸门收口在 SemanticCacheService#cacheable 一处：
  # 意图白名单 + 个人标识过滤（问题或答案含 6 位以上连续数字即跳过）+ 双层隔离。
  # 往 cacheable-intents 里加意图前，请先回答："两个不同用户问同一句话，答案是否必然相同？"
  semantic-cache:
    enabled: true
    store-mode: jdbc
  # =================== B6 运营闭环 结束 ===================

  # 调用明细是 Trace/Replay、实验指标、SLO 与成本归因的共同事实表；生产与本地集成环境均持久化。
  call-log:
    enabled: true
    store-mode: jdbc

  chat-log:
    # 聊天日志（会话/工单消息留痕）：存储模式 memory | jdbc（MyBatis-Plus 实现，跨实例共享）
    # badcase 登记时靠它回查「用户问了什么、AI 答了什么」，不开则筛选界面没有上下文
    store-mode: jdbc
  agent-access:
    # 坐席访问凭证 HMAC 签名密钥：生产必须用环境变量 CW_AGENT_WS_SECRET 覆盖
    secret: ${CW_AGENT_WS_SECRET:dev-agent-secret-change-me-0001}
  tool-backend:
    # 业务工具后端：mock（默认，starter Mock 实现）| jdbc（starter MyBatis-Plus 实现，落 cw_order/cw_product 等演示表）
    mode: jdbc
  attachment:
    # 原始文件存储：MinIO 对象存储（唯一后端，项目内不落盘）。
    # bucket 惰性确保：应用启动不连 MinIO，首次上传才检查/建桶，故 MinIO 不可达不影响启动与切片测试。
    storage:
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:minioadmin}
        secret-key: ${MINIO_SECRET_KEY:minioadmin}
        bucket: ${CUSTOMER_WORK_ATTACHMENT_BUCKET:customer-work-attachments}
        auto-create-bucket: ${CUSTOMER_WORK_ATTACHMENT_AUTO_CREATE_BUCKET:true}
    # 追加文本类扩展名（内置已覆盖 md/txt/csv/sql/yaml/log/主流源码等约 50 种，小众类型在此追加，无需改代码）
    # extra-text-extensions: adoc,rst
    # 图片 OCR（不用 tesseract）
    ocr:
      # OCR 引擎：model（视觉大模型）| paddleocr（自建 PaddleOCR 开源 serving，免 Key、数据不出内网）
      engine: paddleocr
      # 视觉模型 API Key：留空则回落 customer-work.model.api-key → 环境变量 DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY:}
  sensitive-word:
    enabled: true
    store-mode: jdbc
    hit-log:
      enabled: true
      store-mode: jdbc   # 不开这个，命中看板永远是空的

# 生产可观测：Actuator 健康检查 / 指标 / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.richard.fyoung.customerwork: DEBUG
    io.agentscope: INFO

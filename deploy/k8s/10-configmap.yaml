apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-work-config
  namespace: customer-work
data:
  SPRING_PROFILES_ACTIVE: "prod"

  # ---- 外部依赖地址（按实际部署填写）----
  # 客服端库：app-server 直连，admin 的 12 个跨库门面经 admin.customer-work-db.* 绑同一套变量
  # （同一个物理库没有理由有两套变量名）。DATABASE / USERNAME 此前两处清单都缺，
  # 两个服务都会回落到各自 yml 里的 root 默认值——生产用 root 连库不是意图，是没人显式配过。
  MYSQL_HOST: "mysql.customer-work.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "agent_scope_customer_work"
  MYSQL_USERNAME: "customer_work"
  REDIS_HOST: "redis.customer-work.svc.cluster.local"
  REDIS_PORT: "6379"
  NACOS_SERVER_ADDR: "nacos.customer-work.svc.cluster.local:8848"
  NACOS_USERNAME: "nacos"
  MINIO_ENDPOINT: "http://minio.customer-work.svc.cluster.local:9000"

  # ---- admin-server 独立依赖与 app 代理地址 ----
  ADMIN_MYSQL_URL: "jdbc:mysql://mysql.customer-work.svc.cluster.local:3306/customer_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  ADMIN_MYSQL_USERNAME: "customer_admin"
  ADMIN_MYSQL_DATABASE: "customer_admin"
  ADMIN_REDIS_HOST: "redis.customer-work.svc.cluster.local"
  ADMIN_REDIS_PORT: "6379"
  CW_BASE_URL: "http://customer-work-app:8080"
  # 浏览器直连地址，部署前必须替换成网关实际暴露的 wss 地址；prod 门禁会拒绝占位符。
  CW_WS_URL: "wss://REPLACE_ME/ws/agent"
  # K8s 清单未提供可信代码隔离运行时，先关闭执行面；接入独立沙箱后改为 docker。
  ADMIN_SANDBOX_MODE: "disabled"

  # ---- 运行时配置可靠发布 ----
  ADMIN_RUNTIME_PUBLISH_NACOS_ENABLED: "true"
  ADMIN_RUNTIME_PUBLISH_NACOS_SERVER_ADDR: "nacos.customer-work.svc.cluster.local:8848"
  ADMIN_RUNTIME_PUBLISH_NACOS_NAMESPACE: "customer-work"
  ADMIN_RUNTIME_PUBLISH_NACOS_GROUP: "DEFAULT_GROUP"
  ADMIN_RUNTIME_PUBLISH_NACOS_DATA_ID: "customer-work-runtime-config"
  ADMIN_RUNTIME_PUBLISH_NACOS_USERNAME: "nacos"
  # 与 app-server StatefulSet 已配置的稳定 ACK 身份数对齐；扩容前先增加身份与独立 token。
  ADMIN_RUNTIME_PUBLISH_MINIMUM_ACK_COUNT: "2"
  ADMIN_RUNTIME_PUBLISH_SIGNING_ENABLED: "true"
  ADMIN_RUNTIME_PUBLISH_SIGNING_KEY_ID: "runtime-config-primary"
  CUSTOMER_WORK_RUNTIME_CONFIG_ENABLED: "true"
  CW_RUNTIME_CONFIG_SIGNATURE_REQUIRED: "true"
  CW_RUNTIME_CONFIG_SIGNING_KEY_ID: "runtime-config-primary"
  CW_RUNTIME_CONFIG_SUBSCRIBE_RETRY_MS: "10000"
  CW_RUNTIME_CONFIG_ACK_URL: "http://customer-admin-server:8082/api/open/runtime-config/acks"
  # 部署前替换为真实通知网关；占位值会被 prod 门禁拒绝。
  CW_NOTIFICATION_WEBHOOK_URL: "https://REPLACE_ME/notifications"

  # ---- 模型健康动态路由 ----
  ADMIN_MODEL_HEALTH_ENABLED: "true"
  ADMIN_MODEL_HEALTH_SCAN_INTERVAL_MS: "60000"
  ADMIN_MODEL_HEALTH_BATCH_SIZE: "20"
  ADMIN_MODEL_HEALTH_WORKER_COUNT: "8"
  ADMIN_MODEL_HEALTH_QUEUE_CAPACITY: "32"
  ADMIN_MODEL_HEALTH_PROBE_TIMEOUT_SECONDS: "10"
  ADMIN_MODEL_HEALTH_FAILURE_THRESHOLD: "3"
  ADMIN_MODEL_HEALTH_RECOVERY_THRESHOLD: "2"
  ADMIN_MODEL_HEALTH_PROBE_INTERVAL_SECONDS: "300"
  ADMIN_MODEL_HEALTH_COOLDOWN_SECONDS: "60"
  ADMIN_MODEL_HEALTH_MAX_OVERRIDE_HOURS: "24"

  # ---- SLO 多副本周期评估与可靠通知 ----
  ADMIN_SLO_AUTOMATION_ENABLED: "true"
  ADMIN_SLO_SCAN_INTERVAL_MS: "30000"
  ADMIN_SLO_EVALUATION_INTERVAL_MS: "60000"
  ADMIN_SLO_EVALUATION_LEASE_MS: "120000"
  ADMIN_SLO_EVALUATION_BATCH_SIZE: "50"
  ADMIN_SLO_NOTIFICATION_SCAN_INTERVAL_MS: "5000"
  ADMIN_SLO_NOTIFICATION_LEASE_MS: "30000"
  ADMIN_SLO_NOTIFICATION_BATCH_SIZE: "50"
  ADMIN_SLO_NOTIFICATION_BASE_BACKOFF_MS: "1000"
  ADMIN_SLO_NOTIFICATION_MAX_BACKOFF_MS: "60000"

  # ---- KnowledgeGap / badcase 责任、发布与上线效果闭环 ----
  ADMIN_IMPROVEMENT_AUTOMATION_ENABLED: "true"
  ADMIN_IMPROVEMENT_SCAN_INTERVAL_MS: "30000"
  ADMIN_IMPROVEMENT_LEASE_MS: "120000"
  ADMIN_IMPROVEMENT_BATCH_SIZE: "50"
  ADMIN_IMPROVEMENT_OBSERVATION_WINDOW_MS: "86400000"
  ADMIN_IMPROVEMENT_MIN_EXPOSURE_CALLS: "20"
  ADMIN_IMPROVEMENT_MAX_RECURRENCE_SIGNALS: "0"
  ADMIN_IMPROVEMENT_MAX_BACKOFF_MS: "300000"

  # ---- 模型调用精确结算与 T+1 对账 ----
  ADMIN_BILLING_AGGREGATION_ENABLED: "true"
  ADMIN_BILLING_AGGREGATION_INTERVAL_MS: "21600000"
  ADMIN_BILLING_AGGREGATION_BACKFILL_DAYS: "3"
  ADMIN_BILLING_SETTLEMENT_ZONE: "Asia/Shanghai"
  ADMIN_BILLING_MAX_RECONCILIATION_DAYS: "31"

  # ---- 高风险变更治理 ----
  ADMIN_GOVERNANCE_APPROVAL_EXPIRY_HOURS: "24"
  ADMIN_GOVERNANCE_EXECUTION_TIMEOUT_SECONDS: "600"
  ADMIN_GOVERNANCE_AUDIT_RETENTION_DAYS: "3650"

  # ---- 多副本必须项 ----
  # 三个进程内实现切成 Redis 共享：不切就等于每个副本各有一份配额、各锁各的会话。
  # 详见 deploy/k8s/README.md「多副本的前提」。
  CUSTOMER_WORK_DISTRIBUTED_COUNTERMODE: "redis"
  CUSTOMER_WORK_DISTRIBUTED_SESSIONLOCKMODE: "redis"
  # 会话锁的持有超时要显著大于单次对话的最长处理时间，否则长响应会在处理中途失去互斥保护
  CUSTOMER_WORK_DISTRIBUTED_SESSIONLOCKLEASESECONDS: "120"
  CUSTOMER_WORK_DISTRIBUTED_SESSIONLOCKWAITSECONDS: "10"

  # ---- 健康探针 ----
  # liveness/readiness 分离端点默认关闭，K8s 探针要用就得显式开
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"

  # ---- 优雅停机 ----
  # 必须小于 StatefulSet 的 terminationGracePeriodSeconds，否则处理中的对话会被 SIGKILL 打断
  CUSTOMER_WORK_RUNTIME_SHUTDOWNTIMEOUTSECONDS: "30"

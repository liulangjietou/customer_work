# 模板文件：不要把真实密钥提交进仓库。
# 生产建议用 External Secrets Operator / Vault / 云厂商 KMS 注入，
# 或用 kubectl create secret 命令行创建（见 deploy/k8s/README.md）。
apiVersion: v1
kind: Secret
metadata:
  name: customer-work-secret
  namespace: customer-work
type: Opaque
stringData:
  DASHSCOPE_API_KEY: "REPLACE_ME"
  MYSQL_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  NACOS_PASSWORD: "REPLACE_ME"
  # 8080 只保存原始 API Key 的 SHA-256 摘要；原始值只下发给调用方。
  AUTH_KEY_ID: "REPLACE_ME"
  AUTH_KEY_HASH: "REPLACE_WITH_64_CHAR_SHA256_HEX"
  AUTH_KEY_TENANT_ID: "default"
  AUTH_KEY_SCOPES: "*"
  AUTH_KEY_EPOCH: "1"
  # 终端用户登录态 JWT 签名密钥；不覆盖会退到开发默认值，等于任何人都能伪造登录态
  CW_USER_JWT_SECRET: "REPLACE_ME"
  # 坐席 WebSocket/HMAC 令牌签名密钥
  CW_AGENT_WS_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  # 审批操作员 token→姓名映射。实际部署应替换 JSON 中的 token 与姓名；不要把真实值提交。
  SPRING_APPLICATION_JSON: '{"customer-work":{"security":{"approval-auth":{"operators":{"REPLACE_TOKEN":"operator-a"}}}}}'
  # 后台敏感字段加解密密钥
  ADMIN_AES_SECRET_KEY: "REPLACE_ME"
  ADMIN_MYSQL_PASSWORD: "REPLACE_ME"
  ADMIN_REDIS_PASSWORD: "REPLACE_ME"
  # admin 调用 8080 使用的原始 Key；其 SHA-256 必须等于 AUTH_KEY_HASH，并携带同一 keyId。
  ADMIN_CUSTOMER_WORK_API_KEY_ID: "REPLACE_ME"
  ADMIN_CUSTOMER_WORK_API_KEY: "REPLACE_ME"
  # 每个固定 StatefulSet 序号使用独立 ACK token；每项至少 32 字节。
  CW_RUNTIME_CONFIG_ACK_TOKEN_0: "REPLACE_WITH_APP_0_ACK_TOKEN"
  CW_RUNTIME_CONFIG_ACK_TOKEN_1: "REPLACE_WITH_APP_1_ACK_TOKEN"
  # 发布端冻结的目标身份必须与 StatefulSet 名称及上面两枚 token 精确对应。
  ADMIN_RUNTIME_PUBLISH_ACK_IDENTITIES: "default|customer-work-app-0|REPLACE_WITH_APP_0_ACK_TOKEN,default|customer-work-app-1|REPLACE_WITH_APP_1_ACK_TOKEN"
  # 发布端与消费端使用同一枚 HMAC-SHA256 密钥；至少 32 字节。
  ADMIN_RUNTIME_PUBLISH_SIGNING_SECRET: "REPLACE_WITH_RUNTIME_CONFIG_SIGNING_SECRET"
  CW_RUNTIME_CONFIG_SIGNING_SECRET: "REPLACE_WITH_RUNTIME_CONFIG_SIGNING_SECRET"
  # admin 非多租户开放 API 使用独立 token，不得复用任何 ACK token。
  ADMIN_OPEN_API_TOKEN: "REPLACE_ME"
  ADMIN_RUNTIME_PUBLISH_NACOS_PASSWORD: "REPLACE_ME"
  # 必须与 ADMIN_AES_SECRET_KEY 是同一枚 16/24/32 字节密钥。
  CUSTOMER_WORK_CONFIG_AES_KEY: "REPLACE_ME"
  CW_NOTIFICATION_AUTH_TOKEN: "REPLACE_ME"

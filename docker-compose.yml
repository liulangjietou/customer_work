# 一键起依赖 + 应用：docker compose up -d
# 仅起依赖（本地用 mvn spring-boot:run 跑应用）：docker compose up -d redis mysql minio nacos xxl-job-admin
services:
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_scope_customer_work}
    ports: ["3306:3306"]
    # 03-xxl-job 脚本自带 `CREATE DATABASE IF NOT EXISTS xxl_job`，随 MYSQL_DATABASE 一起在
    # 容器首次初始化时执行；customer_admin 库由 admin-server Flyway 或 DBA 镜像脚本维护。
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/03-xxl-job/xxl-job-schema.sql:/docker-entrypoint-initdb.d/xxl-job-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # XXL-JOB 调度中心（本项目定时任务功能的调度触发方；镜像版本与 pom 里的 xxl-job-core 严格对应，
  # 见 mysql/03-xxl-job/xxl-job-schema.sql 头部说明）。默认账号 admin/123456，首次登录后请改密。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.2
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8088:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-root}

  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # compose 默认是本地联调环境；生产必须显式设置 prod 并通过全部启动门禁。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      NACOS_SERVER_ADDR: nacos:8848

volumes:
  redis-data:
  mysql-data:
  minio-data:

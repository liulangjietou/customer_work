# 一键起依赖 + 应用：docker compose up -d
# 仅起依赖（本地用 mvn spring-boot:run 跑应用）：docker compose up -d redis mysql nacos
services:
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_scope_customer_work}
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      NACOS_SERVER_ADDR: nacos:8848

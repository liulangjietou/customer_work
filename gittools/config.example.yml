# 复制为 config.local.yml 后填写真实值，并通过 --spring.config.additional-location 加载。
gittools:
  provider: github
  repository: https://github.com/acme/demo
  # GitHub 默认 https://api.github.com；GitLab 默认由仓库地址推导 /api/v4。
  api-base-url: https://api.github.com
  token: ${GITTOOLS_GIT_TOKEN}
  server-token: ${GITTOOLS_SERVER_TOKEN}
  ref: main
  connect-timeout: 5s
  read-timeout: 20s
  max-response-bytes: 2097152
  max-file-bytes: 524288

server:
  address: 127.0.0.1
  port: 3002

# GitLab 示例：
# gittools:
#   provider: gitlab
#   repository: https://gitlab.example.com/team/platform/demo
#   api-base-url: https://gitlab.example.com/api/v4

server:
  port: 8080

spring:
  application:
    name: customer-work

customer-work:
  model:
    # 以阿里云百炼（DashScope）为准。生产强烈建议用环境变量 DASHSCOPE_API_KEY 注入密钥，
    # 此处的默认值仅为开箱即用；切勿把生产密钥长期留在代码仓库中。
    api-key: ${DASHSCOPE_API_KEY:sk-9de889ef6db7405281412384110ed033}
    # 可切换为 qwen-plus / qwen-turbo 等；模型名对应 DashScope 通义千问系列
    name: qwen-max
    # 自定义网关 / 百炼兼容地址；留空用 SDK 默认百炼地址
    base-url: ""
    temperature: 0.3
    max-tokens: 1500
    stream: true
  session:
    # 会话持久化模式：memory（默认，重启丢）| json（单机落盘可恢复）
    # 分布式生产请扩展为 redis / mysql（框架内置 RedisSession / MysqlSession）
    mode: memory
    directory: ./data/sessions
  agent:
    # ReAct 最大推理-行动轮次
    max-iters: 10
    # Meta-Tool（元工具）：允许 Agent 运行时自主启停工具组，缓解上下文压力。默认关闭
    meta-tool-enabled: false
  memory:
    # 长期记忆（跨会话、按租户隔离）。内置进程内实现，生产可切百炼长期记忆 / Mem0 / ReMe
    long-term-enabled: true
    # 租户解析分隔符：sessionId 形如 tenantA:conv-1 时，分隔符前为租户，同租户跨会话共享记忆
    tenant-delimiter: ":"
    retrieve-top-k: 5
  plan:
    # PlanNotebook 任务规划：引导 Agent 有序完成长链路任务
    enabled: true
    max-subtasks: 20

logging:
  level:
    root: INFO
    com.example.customerwork: DEBUG
    io.agentscope: INFO
